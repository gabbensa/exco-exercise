name: CI-CD
on:
  push:
    branches: [main]
    paths:
      - app.py
      - requirements.txt
      - Dockerfile
      - .github/workflows/cicd.yaml

permissions:
  contents: write
  packages: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/exco-web:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/exco-web:${{ github.sha }}

      - name: Bump image tag in k8s manifest (GitOps)
        run: |
          sed -i "s|image: ghcr.io/.*/exco-web:.*|image: ghcr.io/${{ github.repository_owner }}/exco-web:${{ github.sha }}|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "ci: deploy exco-web ${{ github.sha }}" || echo "nothing to bump yet"
          git push
